<svg style="background:white" class="concept-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 570" role="img" aria-label="前の学びが、次の道具になる。図にすると、前に習った式が「使える道具」に変わります。"><text x="14" y="25" fill="#3566a0" font-size="17.86" font-family="sans-serif">01  面積から長さへ｜平方根・方程式</text><polygon points="25,126 70,126 70,81 25,81" fill="#edf3f9" stroke="#61716b" stroke-width="1.5"/><text x="40.5" y="110.5" fill="#3566a0" font-size="18.799999999999997" font-family="sans-serif">1</text><line x1="25" y1="126" x2="70" y2="126" stroke="#3566a0" stroke-width="2.2" stroke-dasharray=""/><text x="35.5" y="150" fill="#3566a0" font-size="18" font-family="sans-serif">1</text><polygon points="139,126 202.63961030678928,126 202.63961030678928,62.36038969321072 139,62.36038969321072" fill="#edf3f9" stroke="#61716b" stroke-width="1.5"/><text x="163.81980515339464" y="101.18019484660536" fill="#3566a0" font-size="18.799999999999997" font-family="sans-serif">2</text><line x1="139" y1="126" x2="202.63961030678928" y2="126" stroke="#3566a0" stroke-width="2.2" stroke-dasharray=""/><text x="158.81980515339464" y="150" fill="#3566a0" font-size="18" font-family="sans-serif">√2</text><text x="31" y="57" fill="#61716b" font-size="16" font-family="sans-serif">面積</text><text x="276" y="57" fill="#253b39" font-size="18" font-family="sans-serif">面積を2倍にしたい。</text><text x="276" y="84" fill="#253b39" font-size="17" font-family="sans-serif">辺を2倍にすると、4倍。</text><text x="276" y="108" fill="#253b39" font-size="15" font-family="sans-serif">大きい方の1辺をkとすると</text><text x="276" y="134" fill="#253b39" font-size="19.74" font-family="sans-serif">k × k = 2</text><text x="276" y="160" fill="#253b39" font-size="18" font-family="sans-serif">だから k=√2（k&gt;0）</text><line x1="257" y1="129" x2="211" y2="116" stroke="#3566a0" stroke-width="1.3" stroke-dasharray=""/><line x1="211" y1="116" x2="219.86320573865206" y2="114.43680326435691" stroke="#3566a0" stroke-width="1.3" stroke-dasharray=""/><line x1="211" y1="116" x2="217.73395110605094" y2="121.97108888740699" stroke="#3566a0" stroke-width="1.3" stroke-dasharray=""/><line x1="14" y1="174" x2="535" y2="174" stroke="#d8dfd6" stroke-width="1" stroke-dasharray=""/><text x="14" y="203" fill="#3566a0" font-size="17.86" font-family="sans-serif">02  縦だけ？ 縦横とも？｜二次関数</text><polygon points="23,309 57,309 57,283" fill="#f4f6f0" stroke="#61716b" stroke-width="1.5"/><line x1="23" y1="309" x2="57" y2="309" stroke="#3566a0" stroke-width="2.2" stroke-dasharray=""/><line x1="57" y1="309" x2="57" y2="283" stroke="#98502f" stroke-width="2.2" stroke-dasharray=""/><text x="15" y="334" fill="#253b39" font-size="15" font-family="sans-serif">もと</text><text x="24" y="357" fill="#253b39" font-size="17" font-family="sans-serif">1倍</text><polygon points="102,309 136,309 136,257" fill="#f4f6f0" stroke="#61716b" stroke-width="1.5"/><line x1="102" y1="309" x2="136" y2="309" stroke="#3566a0" stroke-width="2.2" stroke-dasharray=""/><line x1="136" y1="309" x2="136" y2="257" stroke="#98502f" stroke-width="2.2" stroke-dasharray=""/><text x="94" y="334" fill="#253b39" font-size="15" font-family="sans-serif">yだけ2倍</text><text x="103" y="357" fill="#253b39" font-size="17" font-family="sans-serif">2倍</text><polygon points="188,309 256,309 256,257" fill="#f4f6f0" stroke="#61716b" stroke-width="1.5"/><line x1="188" y1="309" x2="256" y2="309" stroke="#3566a0" stroke-width="2.2" stroke-dasharray=""/><line x1="256" y1="309" x2="256" y2="257" stroke="#98502f" stroke-width="2.2" stroke-dasharray=""/><text x="180" y="334" fill="#253b39" font-size="15" font-family="sans-serif">縦横2倍</text><text x="189" y="357" fill="#253b39" font-size="17" font-family="sans-serif">4倍</text><text x="19" y="235" fill="#61716b" font-size="16" font-family="sans-serif">三角形の面積で比べると</text><text x="286" y="249" fill="#98502f" font-size="18" font-family="sans-serif">aを2倍 → yだけ2倍。</text><text x="286" y="280" fill="#253b39" font-size="17.86" font-family="sans-serif">y=x² → y=2x²</text><text x="286" y="320" fill="#253b39" font-size="18" font-family="sans-serif">相似拡大は、</text><text x="286" y="347" fill="#3566a0" font-size="18" font-family="sans-serif">xもyも同じ倍率。</text><line x1="14" y1="377" x2="535" y2="377" stroke="#d8dfd6" stroke-width="1" stroke-dasharray=""/><text x="14" y="406" fill="#3566a0" font-size="17.86" font-family="sans-serif">03  同じ形のまま大きく｜三平方・三角比</text><polygon points="35,520 87,520 87,481" fill="#edf3f9" stroke="#61716b" stroke-width="1.5"/><line x1="35" y1="520" x2="87" y2="520" stroke="#3566a0" stroke-width="2.2" stroke-dasharray=""/><line x1="87" y1="520" x2="87" y2="481" stroke="#98502f" stroke-width="2.2" stroke-dasharray=""/><line x1="53.0" y1="520.0" x2="52.99353017391383" y2="519.517431993961" stroke="#61716b" stroke-width="2.3" stroke-dasharray=""/><line x1="52.99353017391383" y1="519.517431993961" x2="52.9741253466164" y2="519.0352108913747" stroke="#61716b" stroke-width="2.3" stroke-dasharray=""/><line x1="52.9741253466164" y1="519.0352108913747" x2="52.941799467647456" y2="518.5536833463153" stroke="#61716b" stroke-width="2.3" stroke-dasharray=""/><line x1="52.941799467647456" y1="518.5536833463153" x2="52.89657577509756" y2="518.0731955142799" stroke="#61716b" stroke-width="2.3" stroke-dasharray=""/><line x1="52.89657577509756" y1="518.0731955142799" x2="52.83848677890291" y2="517.5940928033472" stroke="#61716b" stroke-width="2.3" stroke-dasharray=""/><line x1="52.83848677890291" y1="517.5940928033472" x2="52.767574237474946" y2="517.1167196258746" stroke="#61716b" stroke-width="2.3" stroke-dasharray=""/><line x1="52.767574237474946" y1="517.1167196258746" x2="52.68388912768147" y2="516.6414191509108" stroke="#61716b" stroke-width="2.3" stroke-dasharray=""/><line x1="52.68388912768147" y1="516.6414191509108" x2="52.58749160820098" y2="516.1685330575013" stroke="#61716b" stroke-width="2.3" stroke-dasharray=""/><line x1="52.58749160820098" y1="516.1685330575013" x2="52.47845097627638" y2="515.6984012890666" stroke="#61716b" stroke-width="2.3" stroke-dasharr