window.__workerSource="let py, scope;\nconst setup = `\nimport random as _random, json as _json, math as _math\nfrom js import postMessage as _post\n\ndef _emit(kind, data):\n    _post(_json.dumps({\"type\": kind, \"data\": data}, ensure_ascii=False))\n\ndef show_graph(counts):\n    values = list(counts)\n    if len(values) != 6 or any(not isinstance(x, (int, float)) or not _math.isfinite(x) or x \u003c 0 for x in values):\n        raise ValueError(\"show_graphには、0以上の数が6つ入ったリストを渡そう\")\n    _emit(\"graph\", values)\n\n_game = None\n\ndef create_game(title, roller, budget=200):\n    global _game\n    if not callable(roller):\n        raise TypeError(\"2番目にはroll関数を渡そう。roll()ではなくrollだよ\")\n    if type(budget) is not int or not 10 \u003c= budget \u003c= 10000:\n        raise ValueError(\"budgetは10〜10000の整数にしよう\")\n    _game = {\"title\": str(title)[:80], \"roller\": roller, \"budget\": budget, \"kind\": _random.choice([\"ふつう\", \"6が好き\", \"偶数が好き\"]), \"counts\": [0]*6, \"ended\": False}\n    _emit(\"game\", {\"title\": _game[\"title\"], \"budget\": budget, \"counts\": _game[\"counts\"], \"ended\": False})\n\ndef _action(action, value):\n    global _game\n    if _game is None:\n        raise ValueError(\"先にcreate_gameを実行しよう\")\n    g = _game\n    if action == \"new\":\n        create_game(g[\"title\"], g[\"roller\"], g[\"budget\"])\n    elif action == \"sample\":\n        if g[\"ended\"]:\n            return\n        n = min(int(value), g[\"budget\"] - sum(g[\"counts\"]))\n        if not 0 \u003c= n \u003c= 10000:\n            raise ValueError(\"回数を確かめよう\")\n        updated = g[\"counts\"][:]\n        for _ in range(n):\n            face = g[\"roller\"](g[\"kind\"])\n            if type(face) is not int or not 1 \u003c= face \u003c= 6:\n                raise ValueError(\"rollは1〜6の整数をreturnしよう\")\n            updated[face-1] += 1\n        g[\"counts\"] = updated\n        _emit(\"game\", {\"title\":g[\"title\"], \"budget\":g[\"budget\"], \"counts\":updated, \"ended\":False})\n    elif action == \"guess\":\n        if g[\"ended\"]:\n            return\n        if value not in [\"ふつう\", \"6が好き\", \"偶数が好き\", \"保留\"]:\n            raise ValueError(\"候補から選ぼう\")\n        g[\"ended\"] = True\n        _emit(\"verdict\", {\"kind\": g[\"kind\"], \"guess\":value, \"correct\": value == g[\"kind\"]})\n`;\nlet lines=0;\nfunction send(type,data){postMessage(JSON.stringify({type,data}));}\nonmessage = async ({data:m}) => {\n  try {\n    if(m.type==='init'){\n      importScripts('https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js');\n      py=await loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/'});\n      py.setStdout({batched:s=>{if(lines++\u003c200)send('stdout',s);else if(lines===201)send('stdout','…表示は200行まで。処理は続いているよ。');}});\n      py.setStderr({batched:s=>send('stderr',s)});\n      py.setStdin({stdin:()=>{throw Error('このページではinput()の代わりに、コードの変数に値を入れて使おう。');}});\n      send('ready',null);\n    }else if(m.type==='run'){\n      lines=0;\n      if(scope)scope.destroy();\n      scope=py.toPy({});\n      py.runPython(setup,{globals:scope});\n      await py.runPythonAsync(m.code,{globals:scope,filename:'my_game.py'});\n      send('done',null);\n    }else if(m.type==='action'){\n      lines=0;\n      scope.set('_action_name',m.action);scope.set('_action_value',m.value??'');\n      await py.runPythonAsync('_action(_action_name, _action_value)',{globals:scope});\n      send('done',null);\n    }\n  }catch(e){send('error',String(e.message||e));}\n};\n";

function bindEditorKeys(editor){
 let leaveOnTab=false;
 const status=$('#editor-key-status');
 const reset=()=>{leaveOnTab=false;status.textContent='';};
 editor.onblur=reset;
 editor.onkeydown=e=>{
  if(e.isComposing)return;
  if(e.key==='Escape'){
   leaveOnTab=true;
   status.textContent='次のTabで入力欄の外へ移ります。Shift + Tabなら前へ移ります。';
   return;
  }
  if(['Shift','Control','Alt','Meta'].includes(e.key))return;
  if(e.key==='Tab'&&leaveOnTab){reset();return;}
  reset();
  if(e.key==='Tab'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
   e.preventDefault();indentCode(editor,e.shiftKey);
  }
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();if(!busy)run();}
 };
}
function indentCode(editor,unindent){
 const {value,selectionStart:start,selectionEnd:end,selectionDirection:direction}=editor;
 if(!unindent&&start===end){
  editor.setRangeText('    ',start,end,'end');
 }else{
  const first=start===0?0:value.lastIndexOf('\n',start-1)+1;
  // A selection ending at the next line's start does not include that line.
  const limit=end>start&&value[end-1]==='\n'?end-1:end;
  const lastBreak=value.indexOf('\n',limit);
  const last=lastBreak===-1?value.length:lastBreak;
  const rows=value.slice(first,last).split('\n');
  const shifts=rows.map(row=>unindent?-(row.match(/^(?: {1,4}|\t)/)?.[0].length??0):4);
  const replacement=rows.map((row,i)=>unindent?row.slice(-shifts[i]):'    '+row).join('\n');
  if(replacement===value.slice(first,last))return;
  editor.setRangeText(replacement,first,last,'preserve');
  const positionAfter=position=>{
   let offset=first,change=0;
   rows.forEach((row,i)=>{
    if(position>=offset)change+=unindent?-Math.min(-shifts[i],position-offset):shifts[i];
    offset+=row.length+1;
   });
   return position+change;
  };
  editor.setSelectionRange(positionAfter(start),positionAfter(end),direction);
 }
 editor.dispatchEvent(new Event('input',{bubbles:true}));
}

function handle(m){if(m.type==='ready'){clearTimeout(initTimer);ready=true;if(pending){const p=pending;pending=null;send(p);}else{busy=false;controls();}}if(m.type==='stdout'||m.type==='stderr'){$('#output').textContent+=m.data+'\n';}if(m.type==='graph')$('#chart').innerHTML=chart(m.data);if(m.type==='game'){game=m.data;drawGame();}if(m.type==='verdict'){game.ended=true;game.verdict=m.data;drawGame();}if(m.type==='done'){clearTimeout(timer);busy=false;runSucceeded=true;controls();if(game)drawGame();$('#download-game').disabled=!game||$('#editor').value!==lastCode;if(!$('#output').textContent)$('#output').textContent=game?'ゲームができた！ 下のボタンで調べよう。':'実行できたよ。表示したいときはprintを使おう。';}if(m.type==='error')fail(m.data,!ready);}
function send(m){busy=true;controls();timer=setTimeout(()=>{stop(false);showError('実行が15秒を超えたので止めたよ。回数を小さくするか、繰り返しの条件を確認しよう。');},15000);worker.postMessage(m);}
async function run(){if(busy)return;lastCode=$('#editor').value;drafts[current]=lastCode;save();runSucceeded=false;game=null;$('#game').innerHTML='';$('#chart').innerHTML='';$('#output').textContent='';$('#error').innerHTML='';$('#download-game').disabled=true;busy=true;controls();const m={type:'run',code:lastCode};if(ready){send(m);}else{pending=m;const id=epoch;try{await init(id);}catch(e){if(id===epoch)fail(String(e),true);}}}
function stop(notify){epoch++;if(worker)worker.terminate();worker=null;ready=false;busy=false;pending=null;game=null;runSucceeded=false;clearTimeout(timer);clearTimeout(initTimer);$('#game').innerHTML='';$('#download-game').disabled=true;controls();if(notify){$('#output').textContent+='\n実行を止めたよ。コードはそのまま残っている。\n';toast('停止したよ。直してから、もう一度実行しよう。');}}
function fail(s,reset=false){clearTimeout(timer);clearTimeout(initTimer);busy=false;pending=null;runSucceeded=false;if(reset){worker?.terminate();worker=null;ready=false;}controls();if(game)drawGame();$('#download-game').disabled=true;showError(s);}
function showError(s){let title='ここを確認して、もう一度やってみよう。',tip=s;
if(/IndentationError|TabError/.test(s)){title='字下げをそろえよう';tip='for・if・defの下は、半角スペース4個分右にずらすよ。同じ仲間は同じ深さにしよう。';}
else if(/SyntaxError/.test(s)){title='記号を見直してみよう';tip='for・if・defの行の最後に : はある？ 括弧や引用符はペア？ 全角の記号が混ざっていないかも見よう。';}
else if(/NameError/.test(s)){title='名前が見つからなかったよ';tip='変数や関数のつづり、大文字・小文字を確認しよう。import randomは書いた？ 変数は使う前に用意しよう。';}
else if(/IndexError/.test(s)){title='リストの外を見にいったみたい';tip='6つのリストの場所は0〜5。出目1〜6を場所に変えるには face - 1 だよ。';}
else if(/ZeroDivisionError/.test(s)){title='0では割れないよ';tip='nが0になっていないかな？ 割合を調べる実験では、nを1以上にしよう。';}
else if(/TypeError/.test(s)){title='道具に渡すものを確認しよう';tip='文字と数字を混ぜて計算していない？ print("回数:", n)のようにカンマで分けられるよ。rollはreturnで整数を返そう。';}
const matches=[...s.matchAll(/File "my_game.py", line (\d+)/g)];const line=matches.length?matches[matches.length-1][1]:null;
$('#error').innerHTML=`<div class="error-box"><h3>${esc(title)}</h3>${line?`<strong>my_game.py の ${line} 行目付近</strong>`:''}<p>${esc(tip)}</p><details><summary>元のエラーメッセージ</summary><pre>${esc(s)}</pre></details></div>`;}
function chart(c){const total=c.reduce((a,b)=>a+b,0),max=Math.max(1,...c);return `<div class="chart"><div class="chart-title"><strong>出目の記録</strong><span>合計 ${total.toLocaleString()} 回</span></div><div class="bars" role="img" aria-label="${c.map((v,i)=>`${i+1}の目が${v}回`).join('、')}">${c.map(v=>`<div class="bar-col"><div class="bar-value">${v.toLocaleString()}</div><div class="bar" style="height:${v/max*125}px"></div></div>`).join('')}</div><div class="bar-labels">${c.map((v,i)=>`<div><strong>${i+1}</strong><small>${total?(v/total*100).toFixed(1):'0.0'}%</small></div>`).join('')}</div><p class="chart-foot">公平なサイコロの目安：どの目も約16.7%。<br>棒の高さは実験ごとに調整。比較するときは割合を見よう。</p></div>`;}
function drawGame(){if(!game)return;const g=game,t=g.counts.reduce((a,b)=>a+b,0),v=g.verdict;$('#game').innerHTML=`<div class="card game-card"><div class="game-banner"><div class="eyebrow">DICE DETECTIVE / CASE FILE</div><h2>${esc(g.title)}</h2><p>正体は3種類のどれか。君のPythonで出目を調べよう。</p></div><div class="case-metrics"><div><span>調査した回数</span><br><strong>${t}</strong><span> / ${g.budget} 回</span></div><div><span>偶数の割合</span><br><strong>${t?((g.counts[1]+g.counts[3]+g.counts[5])/t*100).toFixed(1):'—'}</strong><span> ${t?'%':''}</span></div></div>${chart(g.counts)}<div class="game-toolbar">${[10,50,100].map(n=>`<button data-sample="${n}" ${busy||g.ended||t>=g.budget?'disabled':''}>+${n}回 調べる</button>`).join('')}</div><div class="guess-area"><strong>どんなサイコロだと思う？</strong><p class="small">迷ったら追加調査。残り回数が足りないときは、残りだけ振るよ。</p><div class="guess-buttons">${['ふつう','6が好き','偶数が好き','保留'].map(k=>`<button data-guess="${k}" ${busy||g.ended||t===0?'disabled':''}>${k==='保留'?'保留して答えを見る':k}</button>`).join('')}</div></div>${v?`<div class="verdict" role="status"><h3>${v.guess==='保留'?'保留も、探偵の大切な判断。':v.correct?'正体を見抜いた！':'今回は、予想と違った！'}</h3><p>仕込まれていた正体は「${esc(v.kind)}」。<br>結果は偶然でも偏るよ。少ない回数から必ず正体が分かるわけではないんだ。</p><button id="new-case" ${busy?'disabled':''}>新しい事件に挑戦</button></div>`:''}</div>`;document.querySelectorAll('[data-sample]').forEach(b=>b.onclick=()=>action('sample',Number(b.dataset.sample)));document.querySelectorAll('[data-guess]').forEach(b=>b.onclick=()=>action('guess',b.dataset.guess));if($('#new-case'))$('#new-case').onclick=()=>action('new','');}
function action(a,v){if(busy||!ready)return;$('#error').innerHTML='';send({type:'action',action:a,value:v});drawGame();}
function download(name,data,type){const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);}
const portablePython=`# ブラウザ教材の完成部品：文字で遊べる版\nimport random as _random\n\ndef show_graph(counts):\n    total = sum(counts)\n    for face, count in enumerate(counts, 1):\n        percent = count / total * 100 if total else 0\n        print(face, "|", "■" * round(percent), count, f"({percent:.1f}%)")\n\ndef create_game(title, roller, budget=200):\n    kind = _random.choice(["ふつう", "6が好き", "偶数が好き"])\n    counts = [0] * 6\n    print(title)\n    print("10 / 50 / 100: 追加調査。候補の名前か『保留』で答え合わせ。終了: やめる")\n    while True:\n        text = input("調査か推理 > ").strip()\n        if text == "やめる":\n            break\n        if text in ["ふつう", "6が好き", "偶数が好き", "保留"]:\n            print("正体:", kind, "正解！" if text == kind else "次の推理につなげよう")\n            break\n        if text not in ["10", "50", "100"]:\n            print("10、50、100、ふつう、6が好き、偶数が好き、保留、やめる のどれかを入力しよう")\n            continue\n        for _ in range(min(int(text), budget - sum(counts))):\n            face = roller(kind)\n            if type(face) is not int or not 1 <= face <= 6:\n                raise ValueError("rollは1〜6の整数を返そう")\n            counts[face - 1] += 1\n        show_graph(counts)\n        print("残り:", budget - sum(counts), "回")\n\n# ----- ここから君のコード -----\n\n`;
function exportPython(){const memo=String(notes[current]??'').split('\n').map(s=>'# '+s).join('\n');download('my_dice_game.py',portablePython+code()+'\n\n# 実験メモ\n'+memo+'\n','text/x-python;charset=utf-8');toast('Pythonファイルを保存したよ。JupyterLabでも使える。');}
async function exportGame(){if(!game||!runSucceeded||code()!==lastCode)return toast('コードを実行して、動きを確かめてから保存しよう。');try{const src=await getWorkerText();const data={code:lastCode,worker:src,title:game.title};const css=window.__styleText??await fetch(assetURL('style.css')).then(r=>{if(!r.ok)throw Error();return r.text();});const js=`const DATA=${JSON.stringify(data).replace(/</g,'\\u003c')};(${portableGame.toString()})();`;download('dice-game.html',`<!doctype html><html lang="ja"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(game.title)}</title><style>${css}</style><body class="portable"><header class="masthead"><div class="brand"><span class="brandmark">⚄</span><strong>サイコロ探偵</strong></div><span class="small" style="color:#c9d0e3">Pythonで作ったゲーム</span></header><main><h1 id="title"></h1><p>秘密のサイコロの正体を、調査して見抜こう。</p><button class="run" id="start">▶ ゲームを始める</button><button id="halt" disabled>停止</button><p id="status" class="status" role="status">最初にPythonを準備するため、ネット接続が必要です。</p><div id="play"></div><pre id="out" class="output"></pre><p class="footer-note">正体は「ふつう」「6が好き」「偶数が好き」の3種類。公平でも偶然偏ります。仕掛けは作者が改造しています。AIやログインは不要です。</p></main><script>${js}<\/script></body></html>`,'text/html');toast('作品を保存したよ。ファイルを開いてゲームを遊べる！');}catch{toast('作品の保存に失敗したよ。ネット接続を確認して再試行しよう。');}}
function portableGame(){const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let w,ready=false,busy=false,g,timer;$('#title').textContent=DATA.title;function status(s){$('#status').textContent=s;}function terminate(){clearTimeout(timer);w?.terminate();w=null;ready=false;busy=false;g=null;$('#play').innerHTML='';$('#start').disabled=false;$('#halt').disabled=true;}function fail(s){terminate();status(s);}function send(m){busy=true;draw();clearTimeout(timer);timer=setTimeout(()=>fail('時間がかかったので停止しました。もう一度始められます。'),15000);w.postMessage(m);}function draw(){if(!g)return;const total=g.counts.reduce((a,b)=>a+b,0),max=Math.max(1,...g.counts),v=g.verdict;$('#play').innerHTML=`<div class="card game-card"><div class="game-banner"><h2>${esc(g.title)}</h2><p>調査 ${total} / ${g.budget}回</p></div><div class="chart"><div class="bars" role="img" aria-label="${g.counts.map((n,i)=>`${i+1}の目:${n}回`).join('、')}">${g.counts.map(n=>`<div class="bar-col"><div class="bar-value">${n}</div><div class="bar" style="height:${n/max*125}px"></div></div>`).join('')}</div><div class="bar-labels">${g.counts.map((n,i)=>`<div><strong>${i+1}</strong><small>${total?(n/total*100).toFixed(1):'0.0'}%</small></div>`).join('')}</div><p class="small">公平なら各目は約16.7%。偶数の割合：${total?((g.counts[1]+g.counts[3]+g.counts[5])/total*100).toFixed(1)+'%':'—'}</p></div><div class="game-toolbar">${[10,50,100].map(n=>`<button data-n="${n}" ${busy||g.ended||total>=g.budget?'disabled':''}>+${n}回</button>`).join('')}</div><div class="guess-area"><strong>正体はどれだ？</strong><p class="small">迷ったら追加で調査しよう。最大回数でも分からないことはあるよ。</p><div class="guess-buttons">${['ふつう','6が好き','偶数が好き','保留'].map(k=>`<button data-k="${k}" ${busy||g.ended||!total?'disabled':''}>${k}</button>`).join('')}</div></div>${v?`<div class="verdict"><h3>${v.guess==='保留'?'保留も大切な判断。':v.correct?'正体を見抜いた！':'今回は予想と違った！'}</h3><p>仕込まれていた正体：${esc(v.kind)}<br>偶然でも偏るので、必ず当たるわけではないよ。</p><button id="again" ${busy?'disabled':''}>新しい事件</button></div>`:''}</div>`;document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>send({type:'action',action:'sample',value:Number(b.dataset.n)}));document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>send({type:'action',action:'guess',value:b.dataset.k}));if($('#again'))$('#again').onclick=()=>send({type:'action',action:'new'});}
$('#halt').onclick=()=>{terminate();status('停止しました。コードは作品ファイルに残っています。');};$('#start').onclick=()=>{terminate();$('#start').disabled=true;$('#halt').disabled=false;$('#out').textContent='';status('Pythonを準備中… 最初は少し時間がかかります。');const url=URL.createObjectURL(new Blob([DATA.worker],{type:'application/javascript'}));w=new Worker(url);URL.revokeObjectURL(url);timer=setTimeout(()=>fail('Pythonを準備できませんでした。ネット接続やフィルターを確認して再試行してください。'),90000);w.onerror=e=>fail('読み込みに失敗しました。接続を確認して再試行してください。');w.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='ready'){ready=true;send({type:'run',code:DATA.code});}else if(m.type==='game'){g=m.data;draw();}else if(m.type==='verdict'){g.ended=true;g.verdict=m.data;draw();}else if(m.type==='stdout'){$('#out').textContent+=m.data+'\n';}else if(m.type==='done'){clearTimeout(timer);busy=false;status('準備OK。出目を調べて、正体を推理しよう。');draw();}else if(m.type==='error'){fail('エラーが出ました。作者にこのメッセージを見せてください。');$('#out').textContent=m.data;}};w.postMessage({type:'init'});};}
render();
const mc=document.modelContext;if(mc?.registerTool){const lifetime=new AbortController();try{Promise.resolve(mc.registerTool({name:'open_dice_mission',description:'指定したPython教材ミッションを開く。コードは実行しない。',inputSchema:{type:'object',properties:{mission:{type:'integer',minimum:1,maximum:7}},required:['mission'],additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(!input||!Number.isInteger(input.mission)||input.mission<1||input.mission>7)throw Error('mission must be 1 to 7');changeLesson(input.mission-1);return {mission:current+1,title:lessons[current].title};}},{signal:lifetime.signal})).catch(()=>{});}catch{}window.addEventListener('pagehide',()=>lifetime.abort(),{once:true});}
